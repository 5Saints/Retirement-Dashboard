[project]
name = "fios-api"
version = "0.1.0"
description = "FIOS minimal API layer (Section 16/17; wraps fios_engine, no DB/auth yet)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# fios_engine is a sibling, non-published local package -- install it into the same
# environment separately (`pip install -e ../engine`) rather than declaring it here as
# a path dependency, which is not portable across pip versions/platforms.

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fios_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

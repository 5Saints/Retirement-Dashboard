[project]
name = "fios-engine"
version = "0.1.0"
description = "FIOS deterministic financial-planning calculation engine (Phase 1: core engine)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fios_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
